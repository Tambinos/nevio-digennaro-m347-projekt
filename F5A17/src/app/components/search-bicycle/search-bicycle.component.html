<button mat-raised-button color="primary" routerLink="/newBicycle">To Default</button>
<label>
  <input [formControl]="formsControl" placeholder="Searched Bicycle"/>
</label>
@for (fullBike of fullBicycles; track $index) {
  <p>Id: {{ fullBike.id }}</p>
  <p>Name: {{ fullBike.name }}</p>
  <p>Value: {{ fullBike.value | currency:'' }}</p>
  <p>Brandname: {{ fullBike.brand }}</p>
  <p>Typename: {{ fullBike.type }}</p>
  <p>---------------</p>
}
