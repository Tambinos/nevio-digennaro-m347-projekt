<mat-toolbar>TODO's</mat-toolbar>
<form (submit)="addTask(textField.value ?? ''); router.navigate([''])">
  <div style="display: flex;justify-content: center;align-items: center;flex-direction: column;height: 75vh;width: 100vw">
    <mat-form-field>
      <mat-label>Todo Name</mat-label>
      <input matInput type="text" [formControl]="textField" required>
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Submit</button>
  </div>
</form>
