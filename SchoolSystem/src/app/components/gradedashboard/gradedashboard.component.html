<div class="app-container">
  <mat-toolbar color="primary" class="app-header">
    <span class="title">Grade System</span>
    <button mat-button routerLink="">Log out</button>
  </mat-toolbar>
  <div class="app-content">
    <button mat-button color="primary" routerLink="/dashboard">❮ Go Back</button>
    <div class="headerAndButtonDiv">
      <mat-card-title class="title">Grades</mat-card-title>
      <button class="mat-elevation-z2" mat-raised-button color="primary" routerLink="/createGrade">Add Grade</button>
    </div>
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="this.gradeService.getGradesOfSubject(this.subjectService.getFocusedSubject().id ?? 0)"
             class="mat-elevation-z8">
        <ng-container matColumnDef="grade">
          <th mat-header-cell *matHeaderCellDef> Grade</th>
          <td mat-cell *matCellDef="let element"> {{ element.grade.grade }}</td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element"> {{ element.date }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-button (click)="editGrade(element.id)">🖋</button>
            <button mat-button (click)="this.gradeService.deleteGrade(element.id)">🗑</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
