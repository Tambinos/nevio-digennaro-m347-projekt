<body>
<div class="app-container">
  <app-toolbar></app-toolbar>
  <div class="app-content">
    <div class="headerAndButtonDiv">
      <button mat-button color="primary" routerLink="/gradeDashboard">❮{{ "Go Back"|translate }}</button>
    </div>
    <div class="creationDiv">
      <mat-form-field>
        <mat-label>{{ 'Grade'|translate }}</mat-label>
        <input type="number" max="6" min="1" matInput [(ngModel)]="selectedGrade">
      </mat-form-field>
      <div>
        <button mat-raised-button class="formLeftButton" routerLink="/gradeDashboard"> {{ 'Cancel' | translate }}
        </button>
        <button mat-raised-button class="formRightButton" (click)="this.handleGrade()"
                routerLink="/gradeDashboard" color="primary">{{ 'Add' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
</body>
