<div class="app-container">
  <mat-toolbar color="primary" class="app-header">
    <span class="title">Grade System</span>
    <button mat-button routerLink="">Log out</button>
  </mat-toolbar>
  <div class="app-content">
    <button mat-button color="primary" routerLink="/gradeDashboard">❮ Go Back</button>
    <div style="display:flex;justify-content: center;align-items: center;height: 90%; flex-direction: column">
      <mat-form-field>
        <mat-label>Grade</mat-label>
        <input matInput [(ngModel)]="selectedGrade">
      </mat-form-field>
      <div>
        <button mat-raised-button class="formLeftButton"  routerLink="/gradeDashboard"> Cancel</button>
        <button mat-raised-button class="formRightButton" (click)="this.createGrade(this.selectedGrade)" routerLink="/gradeDashboard" color="primary">Add</button>
      </div>
    </div>
  </div>
</div>
