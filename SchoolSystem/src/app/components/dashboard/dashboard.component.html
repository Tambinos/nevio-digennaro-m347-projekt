<div class="app-container">
  <mat-toolbar color="primary" class="app-header">
    <span class="title">{{ 'Grade System' | translate }}</span>
    <div style="display: flex;flex-direction: column">
      <button mat-button routerLink="">{{ 'Log out' | translate }}</button>
    </div>
  </mat-toolbar>
  <div class="app-content">
    <div class="headerAndButtonDiv">
      <mat-card-title class="title">{{ 'Subjects' | translate }}</mat-card-title>
      <mat-select [(ngModel)]="languageService.selectedLanguage" style="width: 120px;"
                  (selectionChange)="languageService.switchLanguage(languageService.selectedLanguage)">
        <mat-option *ngFor="let language of languageService.languages" [value]="language">
          {{ language }}
        </mat-option>
      </mat-select>

      <button *ngIf="userService.getLoggedInUser().admin"
              class="mat-elevation-z2 primaryAddButton"
              mat-raised-button
              color="primary" routerLink="/createSubject">
        {{ 'Add Subject' | translate }}
      </button>
    </div>
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="subjectService.subjects" class="mat-elevation-z8">
        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef> {{ 'Subject' | translate }}</th>
          <td mat-cell *matCellDef="let subject" (click)="subjectService.setFocusedSubject(subject)"
              routerLink="/gradeDashboard"> {{ subject.subject }}
          </td>
        </ng-container>
        <ng-container matColumnDef="avgGrade">
          <th mat-header-cell *matHeaderCellDef> {{ 'Average Grade'|translate }}</th>
          <td mat-cell *matCellDef="let subject" (click)="subjectService.setFocusedSubject(subject)"
              routerLink="/gradeDashboard">
            <span class="gradeSpan"
                  [ngStyle]="{'background-color': gradeService.getGradeRatingColor(subjectService.getAverageGrade(subject.id))}">
                {{ Math.round(subjectService.getAverageGrade(subject.id) * 10) / 10}}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> {{ 'Actions'| translate }}</th>
          <td mat-cell *matCellDef="let subject" class="tableActionCell">
            <button *ngIf="userService.getLoggedInUser().admin" mat-button (click)="editSubject(subject)"><i
              class="material-icons">edit</i></button>
            <button *ngIf="userService.getLoggedInUser().admin" mat-button
                    (click)="subjectService.deleteSubject(subject);"
            ><i class="material-icons">delete</i></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <button *ngIf="userService.getLoggedInUser().admin"
            class="secondaryAddButton"
            routerLink="/createSubject"
            mat-fab color="primary">+
    </button>
  </div>
</div>
