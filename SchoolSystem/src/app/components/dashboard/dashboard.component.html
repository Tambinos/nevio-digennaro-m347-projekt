<body>
<div class="app-container">
  <mat-toolbar color="primary" class="app-header">
    <span class="title">{{ 'Grade System' | translate }}</span>
    <button mat-button routerLink="">{{ 'Log out' | translate }}</button>
  </mat-toolbar>
  <div class="app-content">
    <div class="headerAndButtonDiv">
      <mat-card-title class="title">{{ 'Subjects' | translate }}</mat-card-title>
      <mat-select [(ngModel)]="languageService.selectedLanguage" class="languageSelector"
                  (selectionChange)="languageService.switchLanguage(languageService.selectedLanguage)">
        <mat-option *ngFor="let language of languageService.languages" [value]="language">
          {{ language }}
        </mat-option>
      </mat-select>
      <button
        *ngIf="userService.getLoggedInUser().admin"
        class="mat-elevation-z2 primaryAddButton"
        mat-raised-button
        color="primary" routerLink="/createSubject">
        {{ 'Add Subject' | translate }}
      </button>
    </div>
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="subjects" class="mat-elevation-z8">
        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef> {{ 'Subject' | translate }}</th>
          <td mat-cell *matCellDef="let subject" class="tableRow" (click)="subjectService.setFocusedSubject(subject)"
              routerLink="/gradeDashboard"> {{ subject.subject }}
          </td>
        </ng-container>
        <ng-container matColumnDef="avgGrade">
          <th mat-header-cell *matHeaderCellDef> {{ 'Average Grade'|translate }}</th>
          <td mat-cell *matCellDef="let subject" class="tableRow" (click)="subjectService.setFocusedSubject(subject)"
              routerLink="/gradeDashboard">
            <span class="gradeSpan"
                  [ngStyle]="{'background-color': gradeService.getGradeRatingColor(getAvgGrade(subject))}">
                  {{ Math.round((getAvgGrade(subject) * 10)) / 10 }}
            </span>
          </td>
        </ng-container>
        <ng-container *ngIf="userService.getLoggedInUser().admin" matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> {{ 'Actions'| translate }}</th>
          <td mat-cell *matCellDef="let subject" class="tableActionCell">
            <button mat-button
                    (click)="subjectService.setFocusedSubject(subject)" routerLink="/editSubject"><i
              class="material-icons">edit</i></button>
            <button mat-button
                    (click)="subjectService.setFocusedSubject(subject);showPopup = true"
            ><i class="material-icons">delete</i></button>
            <div
              class="popup-backdrop"
              *ngIf="showPopup">
              <app-delete-pop-up
                (decision)="handleEvent($event,subjectService.getFocusedSubject())">
              </app-delete-pop-up>
            </div>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <button
      *ngIf="userService.getLoggedInUser().admin"
      class="secondaryAddButton"
      routerLink="/createSubject"
      mat-fab color="primary">+
    </button>
  </div>
</div>
</body>
