<div class="app-container">
  <mat-toolbar color="primary" class="app-header">
    <span class="title">Grade System</span>
    <button mat-button routerLink="">Log out</button>
  </mat-toolbar>
  <div class="app-content">
    <div class="headerAndButtonDiv">
      <mat-card-title class="title">Subjects</mat-card-title>
      <button *ngIf="userService.getLoggedInUser().admin"  class="mat-elevation-z2"  mat-raised-button color="primary"  routerLink="/createSubject">Add Subject</button>
    </div>
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="this.subjectService.subjects" class="mat-elevation-z8">
        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef> Subject</th>
          <td mat-cell *matCellDef="let element"  (click)="this.subjectService.setFocusedSubject(element)" routerLink="/gradeDashboard"> {{ element.subject }}</td>
        </ng-container>
        <ng-container matColumnDef="avgGrade">
          <th mat-header-cell *matHeaderCellDef> Average Grade</th>
          <td mat-cell *matCellDef="let element"   (click)="this.subjectService.setFocusedSubject(element)" routerLink="/gradeDashboard">{{ this.subjectService.getAverageGrade(element.id) }}</td>
        </ng-container>
        <ng-container  matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions</th>
          <td mat-cell *matCellDef="let element">
            <button *ngIf="userService.getLoggedInUser().admin" mat-button (click)="editSubject(element)">🖋</button>
            <button *ngIf="userService.getLoggedInUser().admin" mat-button (click)="deleteSubject(element)">🗑</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row  *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
