<!-- app.component.html -->
<div class="menu-container">
  <div class="button-row">
    <button (click)="increment()" mat-raised-button color="primary">Button 1</button>
  </div>
  <div class="button-row">
    <button (click)="decrement()" mat-raised-button color="accent">Button 2</button>
  </div>
  <div class="button-row">
    <button (click)="reset()" mat-raised-button color="warn">Button 3</button>
  </div>
  <p>{{counter$ | async}}</p>
</div>
