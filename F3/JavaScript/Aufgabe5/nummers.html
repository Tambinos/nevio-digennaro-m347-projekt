<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="script.js"></script>
</head>
<body>
<div>
    <label><input id="numbersField" type="search"></label>
    <label><input id="submitNumbers" type="button" value="Submit Numbers"></label>
</div>
<h5 id="currentNumbers">Current Numbers:</h5>
<div>
    <div>
        <label><input id="biggestNumberButton" type="button" value="Biggest Number"></label>
        <h5 id="biggestNumber"></h5>
    </div>
    <div>
        <label><input id="smallestNumberButton" type="button" value="Smallest Number"></label>
        <h5 id="smallestNumber"></h5>
    </div>
    <div>
        <label><input id="sumSNumbersButton" type="button" value="Sum of Straight Numbers"></label>
        <h5 id="sumSNumbers"></h5>

    </div>
    <div>
        <label><input id="sumNSNumbersButton" type="button" value="Sum of non Straight Numbers"></label>
        <h5 id="sumNSNumber"></h5>

    </div>
    <div>
        <label><input id="sortAfterSizeButton" type="button" value="Sort after size"></label>
        <h5 id="sortAfterSize"></h5>

    </div>
    <div>
        <label><input id="allButton" type="button" value="Calculate all Numbers"></label>
        <h5 id="all"></h5>
    </div>
    <div>
        <label><input id="avgNumberButton" type="button" value="AVG Number"></label>
        <h5 id="avgNumber"></h5>

    </div>
</div>
</body>
</html>
